name: ci

on:
  push:
    branches: [ main, dev ]
    paths-ignore: [ 'README.md', 'LICENSE' ]
  pull_request:
    paths-ignore: [ 'README.md', 'LICENSE' ]
  workflow_dispatch:

# 版本号只写一次：测试、Android、Windows 三个 job 必须用同一个 Flutter，
# 否则会出现「测试跑的是 A、发布用的是 B」。
env:
  FLUTTER_VERSION: 3.47.5

jobs:
  # ---------------------------------------------------------------- 测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze
      # 贴边隐藏的纯几何部分（不依赖 Flutter / Windows）：贴哪条边、藏到哪、
      # 鼠标碰到哪算唤出、拔掉副屏后夹回哪里 —— 这些边界在真机上试一次要半小时
      - name: Test dock geometry (C++)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            windows/runner/dock_math_test.cpp -o /tmp/dock_math_test
          /tmp/dock_math_test
      # 含：18 张真实收款单的 OCR 回归、WebDAV 端到端同步（自建内存 DAV 服务器）、
      #     合并/墓碑/冲突重试、存储原子写、扫描增量与「手工金额不被覆盖」、UI 冒烟
      - name: Test
        run: flutter test

  # ---------------------------------------------------------------- Android
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Get dependencies
        run: flutter pub get
      # 固定签名：keystore 与口令来自仓库 secrets，保证每次构建签名一致
      # （升级安装不必先卸载）。
      #
      # secrets 没配置时必须**不生成** key.properties —— 否则 build.gradle.kts 会
      # 认为「有发布签名」而去读一个空 keystore，报
      # `KeytoolException: Failed to read key ... Tag number over 30 is not supported`。
      # （secrets 不能在 if: 里直接引用，所以用 env + shell 判断。）
      - name: Decode keystore (skip if secrets absent)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=keystore.jks"
            } > android/key.properties
            echo "已使用仓库 secrets 配置发布签名"
          else
            echo "::notice::未配置签名 secrets，本次使用 debug 签名构建"
          fi
      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform=android-arm64
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk WxBills-debug-arm64.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk WxBills-release-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk WxBills-release-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk WxBills-release-x86_64.apk
      # Android 15+ 的 16KB 页大小兼容：APK 内 .so 必须页对齐，且 ELF LOAD 段 >= 16KB
      - name: Verify 16 KB page-size compatibility
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          for apk in WxBills-release-arm64-v8a.apk WxBills-release-x86_64.apk; do
            if "$ZIPALIGN" -h 2>&1 | grep -q -- " -P "; then
              "$ZIPALIGN" -c -P 16 -v 4 "$apk" > /dev/null \
                || { echo "::error::$apk 内的 .so 未按 16KB 对齐"; exit 1; }
            fi
          done
          rm -rf /tmp/apk-align && mkdir -p /tmp/apk-align
          unzip -q WxBills-release-arm64-v8a.apk -d /tmp/apk-align 'lib/arm64-v8a/*'
          python3 - <<'PY'
          import glob, subprocess, sys
          bad = []
          for so in glob.glob('/tmp/apk-align/lib/**/*.so', recursive=True):
              out = subprocess.check_output(['readelf', '-lW', so], text=True)
              for line in out.splitlines():
                  if line.strip().startswith('LOAD'):
                      align = int(line.split()[-1], 16)
                      if align < 0x4000:
                          bad.append((so, hex(align)))
          if bad:
              print('未按 16KB 对齐的库：', bad)
              sys.exit(1)
          print('16KB 兼容检查通过')
          PY
      # 配了签名 secrets 却仍产出 debug 签名，说明 key.properties 没生效 ——
      # 这种包装到用户手机上会和旧版签名冲突（必须先卸载），必须拦住。
      - name: Verify release signature is not debug
        env:
          HAS_KEY: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$HAS_KEY" ]; then
            echo "::notice::未配置签名 secrets，跳过签名校验（debug 签名）"
            exit 0
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            WxBills-release-arm64-v8a.apk > certs.txt
          cat certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::release APK 仍是 debug 签名，key.properties 没有生效"
            exit 1
          fi
      # 关键权限必须存在（缺 INTERNET 同步直接废掉；缺 MANAGE_EXTERNAL_STORAGE 刷新日期失效）
      - name: Verify manifest permissions
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging WxBills-release-arm64-v8a.apk > badging.txt
          grep -q "android.permission.INTERNET" badging.txt
          grep -q "android.permission.READ_MEDIA_IMAGES" badging.txt
          grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" badging.txt
          grep -q "application-label:'收款单管理'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WxBills-debug-arm64.apk
          path: WxBills-debug-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WxBills-release-apks
          path: WxBills-release-*.apk

  # ---------------------------------------------------------------- Windows x64
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows application (x64)
        run: flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: |
          mkdir WxBills
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "WxBills" -Recurse -Force
          Compress-Archive -Path "WxBills" -DestinationPath "WxBills-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WxBills-windows-x64.zip
          path: WxBills-windows-x64.zip

  # ---------------------------------------------------------------- 发布
  # 仅当 pubspec.yaml 的版本号还没有对应 tag 时才创建 Release
  release:
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [ test, build-android, build-windows ]
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: yq
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq '.version' 'pubspec.yaml'
      - name: Prepare tag name
        id: tag_name
        run: |
          VERSION="${{ steps.yq.outputs.result }}"
          TAG_NAME="v${VERSION%%+*}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          case "$TAG_NAME" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check tag
        id: check-tag
        uses: mukunku/tag-exists-action@v1.6.0
        with:
          tag: ${{ steps.tag_name.outputs.TAG_NAME }}
      - uses: actions/download-artifact@v4
        if: steps.check-tag.outputs.exists == 'false'
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG_NAME }}
          name: ${{ steps.tag_name.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag_name.outputs.PRERELEASE == 'true' }}
          files: |
            artifacts/WxBills-windows-x64.zip
            artifacts/WxBills-debug-arm64.apk
            artifacts/WxBills-release-armeabi-v7a.apk
            artifacts/WxBills-release-arm64-v8a.apk
            artifacts/WxBills-release-x86_64.apk
